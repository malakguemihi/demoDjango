name: Django CI and Deploy to Render

# Trigger workflow عند أي push أو pull request على الفرع master
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - uses: actions/checkout@v3

      # Step 2: Set up Python 3.11 (أو أي إصدار مناسب)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run Django migrations (اختياري قبل build)
      - name: Run migrations
        run: |
          python manage.py migrate

      # Step 5: Collect static files (إذا تستخدم static)
      - name: Collect static files
        run: |
          python manage.py collectstatic --noinput

      # Step 6: Build Docker image
      - name: Build Docker image
        run: docker build -t my-django-app .

      # Step 7: Deploy to Render
      - name: Deploy to production
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
